name: Quality and security gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-integrity:
    name: Replay migrations and test pricing ACID rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Replay database and run pricing integrity tests
        shell: pwsh
        run: ./tests/pricing-migration-local.ps1

  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install black-box test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run quality and security gates
        run: pnpm run ci:core

      - name: Store validated build
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Store black-box failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  pricing-browser:
    name: Pricing browser tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install black-box test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build offline bundle
        run: pnpm build:offline

      - name: Run pricing browser shard
        run: pnpm exec playwright test --config playwright.pricing.config.ts --shard=${{ matrix.shard }}/4

      - name: Store pricing browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pricing-evidence-${{ github.sha }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
